name: verify-quick-updates
description: >-
  Verify, correct, and improve all unverified quick updates. Consolidates
  accumulated quick-update artifacts into a plan, runs slice-doc + verify/fix
  loop per phase, then removes processed artifacts.
steps:
  - script:
      name: collect-quick-updates
      label: collecting quick updates
      metadata_dir: ${app_path}/${docs_dir}/metadata/quick_updates
      output_dir: ${run_dir}
      set: quick_updates

  - if: '${quick_updates.count} != 0'
    label: verifying quick updates
    skip_label: no quick updates to verify
    then:
      - agent:
          prompt: plan-verify-quick-updates
          label: planning verification
          vars:
            app: ${app}
            docs_dir: ${docs_dir}
            manifest_path: ${quick_updates.manifest_path}
            metadata_dir: ${app_path}/${docs_dir}/metadata/quick_updates
            output_path: ${run_dir}/plans/${app}-verify-quick-updates-${date}.plan.md
          expect_file: ${run_dir}/plans/${app}-verify-quick-updates-${date}.plan.md

      - script:
          name: parse-plan
          label: parsing plan
          file: ${run_dir}/plans/${app}-verify-quick-updates-${date}.plan.md
          require_phases: true
          set: phases

      - foreach:
          var: phase
          in: ${phases}
          do:
            - agent:
                prompt: slice-doc
                label: documenting "${phase.title}"
                vars:
                  plan: ${run_dir}/plans/${app}-verify-quick-updates-${date}.plan.md
                  phase_number: ${phase.number}

            - loop:
                max: 3
                until: '${status} == "PASS"'
                do:
                  - agent:
                      prompt: verify-domain-documentation
                      label: verifying "${phase.title}"
                      vars:
                        plan: ${run_dir}/plans/${app}-verify-quick-updates-${date}.plan.md
                        phase_number: ${phase.number}
                        review_path: ${run_dir}/slice-${phase.number}/review-${iteration}.md
                        status_path: ${run_dir}/slice-${phase.number}/status-${iteration}.txt
                        changes_dir: ${app_path}/${docs_dir}/metadata/quick_updates
                        docs_dir: ${docs_dir}

                  - read-file:
                      path: ${run_dir}/slice-${phase.number}/status-${iteration}.txt
                      set: status
                      trim: true

                  - if: '${status} != "PASS"'
                    then:
                      - agent:
                          prompt: fix-documentation
                          label: fixing "${phase.title}"
                          vars:
                            plan: ${run_dir}/plans/${app}-verify-quick-updates-${date}.plan.md
                            phase_number: ${phase.number}
                            review_path: ${run_dir}/slice-${phase.number}/review-${iteration}.md

      - script:
          name: remove-quick-updates
          label: cleaning up artifacts
          manifest: ${quick_updates.manifest_path}
