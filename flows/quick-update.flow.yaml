name: quick-update
description: >-
  Fast single-session documentation update using a cheaper/faster model.
  Produces a metadata artifact for later verification.
steps:
  - script:
      name: check-format-version
      label: checking corpus format version
      app_dir: ${app_path}
      docs_dir: ${docs_dir}
      mode: update

  - script:
      name: detect-changes
      label: detecting changes
      app_dir: ${app_path}
      output_dir: ${run_dir}
      docs_dir: ${docs_dir}
      set: changes

  - if: '${changes.count} != 0'
    label: quick updating documentation
    skip_label: no changes detected
    then:
      - agent:
          prompt: quick-update
          label: updating documentation
          vars:
            app: ${app}
            docs_dir: ${docs_dir}
            changes_path: ${changes.changes_path}
            status_path: ${run_dir}/quick-update-status.txt
            summary_path: ${app_path}/${docs_dir}/metadata/quick_updates/${run_id}/summary.md

      - read-file:
          path: ${run_dir}/quick-update-status.txt
          set: status
          trim: true

      - if: '${status} == "UPDATED"'
        then:
          - script:
              name: archive-quick-update
              label: archiving update
              changes_path: ${changes.changes_path}
              dest_dir: ${app_path}/${docs_dir}/metadata/quick_updates/${run_id}
              summary_path: ${app_path}/${docs_dir}/metadata/quick_updates/${run_id}/summary.md

      - if: '${status} != "UPDATED"'
        then:
          - script:
              name: cleanup-quick-update-dir
              label: cleaning up metadata
              metadata_root: ${app_path}/${docs_dir}/metadata/quick_updates
              run_id: ${run_id}

      - script:
          name: generate-baseline
          label: generating baseline
          app_dir: ${app_path}
          docs_dir: ${docs_dir}
