name: Verify quick updates (weekly)

# Monday maintenance: runs `saaga run quick-update` followed by
# `saaga run verify-quick-updates` so the week's accumulated artifacts are
# consolidated and verified in one pass, then `saaga run sweep-stale-docs`
# to verify documents whose sources changed outside those slices.
# The same publish logic applies: docs-only → main, mixed → PR.

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC every Monday
    - cron: "0 0 * * 1"

concurrency:
  group: saaga-maintenance
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # sweep-stale-docs reads change from git history and refuses a
          # shallow clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install git
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq git

      - name: Install cursor-agent CLI
        run: |
          chmod +x examples/install-agents/install-claude.sh
          ./examples/install-agents/install-claude.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run quick-update, verify, then sweep stale docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx src/cli.ts run quick-update . --ci
          npx tsx src/cli.ts run verify-quick-updates . --ci
          npx tsx src/cli.ts run sweep-stale-docs . --ci

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SAAGA_APP_ID }}
          private-key: ${{ secrets.SAAGA_APP_PRIVATE_KEY }}

      - name: Publish changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          chmod +x .github/scripts/publish-saaga-changes.sh
          ./.github/scripts/publish-saaga-changes.sh "${{ steps.app-token.outputs.token }}" "${{ steps.app-token.outputs.app-slug }}" "verify-quick-updates"
