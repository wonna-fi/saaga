name: Backend Drift Detection

# Runs the full probe suite against whatever the backend CLIs ship today.
#
# The permission profiles depend on undocumented CLI behaviour — which flags
# scope writes, whether a bare tool deny disables everything else, whether a
# tool surface can be narrowed — so a release can silently loosen or break
# them. Nothing is recorded on success: a green run is the signal, and the
# run history is the record.

on:
  workflow_dispatch:
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  probes:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cursor
            install: install-cursor-agent.sh
          - backend: copilot
            install: install-copilot.sh
          - backend: claude
            install: install-claude.sh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.backend }} CLI
        run: |
          chmod +x "examples/install-agents/${{ matrix.install }}"
          "./examples/install-agents/${{ matrix.install }}"

      - name: Run full probe suite
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --json suppresses per-probe progress, so the run is silent until it
        # finishes; the step summary below is where the detail lands.
        run: |
          npx tsx src/cli.ts doctor \
            --backend ${{ matrix.backend }} \
            --level full --ci --json > doctor-result.json

      - name: Summarize probe results
        if: always()
        run: |
          cat > /tmp/summarize.mjs <<'SCRIPT'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";

          const write = (line) =>
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");

          if (!existsSync("doctor-result.json")) {
            write("Doctor produced no output.");
            process.exit(0);
          }

          const raw = readFileSync("doctor-result.json", "utf8");
          let result;
          try {
            result = JSON.parse(raw);
          } catch {
            write("Doctor output was not valid JSON:");
            write("```");
            write(raw.slice(0, 2000));
            write("```");
            process.exit(0);
          }

          for (const backend of result.backends ?? []) {
            write(`## ${backend.backend}`);
            if (!backend.available) {
              write(`Not available: ${backend.reason}`);
              continue;
            }
            write(`CLI version: \`${backend.version}\``);

            const probes = backend.probes ?? [];
            const failed = probes.filter((p) => p.status === "fail");
            const passed = probes.filter((p) => p.status === "pass").length;
            write("");
            write(`${passed} passed, ${failed.length} failed`);
            if (failed.length === 0) continue;

            // classification comes from doctor rerunning a failed capability
            // probe without the permission profile.
            write("");
            write("| Probe | Cause | Detail |");
            write("| --- | --- | --- |");
            for (const probe of failed) {
              const cause =
                probe.classification === "policy-denial"
                  ? "profile too tight for this CLI"
                  : probe.classification === "backend-failure"
                    ? "fails unrestricted too — CLI or environment"
                    : "restriction not enforced";
              const detail = (probe.error ?? "").replace(/\|/g, "\\|");
              write(`| \`${probe.probeId}\` | ${cause} | ${detail} |`);
            }
          }
          SCRIPT
          node /tmp/summarize.mjs

      - name: Upload doctor results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-${{ matrix.backend }}
          path: doctor-result.json
          if-no-files-found: ignore
