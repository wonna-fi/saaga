name: Quick update (nightly)

# Runs `saaga quick-update` from the repository source on main.
# Documentation-only changes are committed straight to main; anything else
# goes into a PR for human review.
# Monday nights are handled by the weekly verify workflow instead.

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC every day except Monday (Monday is the weekly verify run)
    - cron: "0 0 * * 0,2,3,4,5,6"

concurrency:
  group: saaga-maintenance
  cancel-in-progress: false

jobs:
  quick-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install git
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq git

      - name: Install cursor-agent CLI
        run: |
          chmod +x examples/install-agents/install-cursor-agent.sh
          ./examples/install-agents/install-cursor-agent.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run quick-update
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: npx tsx src/cli.ts quick-update . --ci

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SAAGA_APP_ID }}
          private-key: ${{ secrets.SAAGA_APP_PRIVATE_KEY }}

      - name: Publish changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          chmod +x .github/scripts/publish-saaga-changes.sh
          ./.github/scripts/publish-saaga-changes.sh "${{ steps.app-token.outputs.token }}" "${{ steps.app-token.outputs.app-slug }}" "quick-update"
