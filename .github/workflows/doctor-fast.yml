name: Doctor (fast)

# Runs the fast (zero-token) doctor probes against whatever the backend CLIs
# ship today: binary on PATH, --version, and that help still documents every
# flag Saaga passes. Catches flag removals/renames.
# Nothing is recorded on success: a green run is the signal.

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

jobs:
  probes:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cursor
            install: install-cursor-agent.sh
          - backend: copilot
            install: install-copilot.sh
          - backend: claude
            install: install-claude.sh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.backend }} CLI
        run: |
          chmod +x "examples/install-agents/${{ matrix.install }}"
          "./examples/install-agents/${{ matrix.install }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run fast probe suite
        # Fast tier needs no model credentials — version + required-flags only.
        # --json suppresses per-probe progress; the step summary holds detail.
        run: |
          npx tsx src/cli.ts doctor \
            --backend ${{ matrix.backend }} \
            --level fast --ci --json > doctor-result.json

      - name: Summarize probe results
        if: always()
        run: |
          cat > /tmp/summarize.mjs <<'SCRIPT'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";

          const write = (line) =>
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");

          if (!existsSync("doctor-result.json")) {
            write("Doctor produced no output.");
            process.exit(0);
          }

          const raw = readFileSync("doctor-result.json", "utf8");
          let result;
          try {
            result = JSON.parse(raw);
          } catch {
            write("Doctor output was not valid JSON:");
            write("```");
            write(raw.slice(0, 2000));
            write("```");
            process.exit(0);
          }

          for (const backend of result.backends ?? []) {
            write(`## ${backend.backend}`);
            if (!backend.available) {
              write(`Not available: ${backend.reason}`);
              continue;
            }
            write(`CLI version: \`${backend.version}\``);

            const probes = backend.probes ?? [];
            const failed = probes.filter((p) => p.status === "fail");
            const passed = probes.filter((p) => p.status === "pass").length;
            const skipped = probes.filter((p) => p.status === "skip").length;
            write("");
            write(`${passed} passed, ${failed.length} failed, ${skipped} skipped`);
            if (failed.length === 0) continue;

            write("");
            write("| Probe | Detail |");
            write("| --- | --- |");
            for (const probe of failed) {
              const detail = (probe.error ?? "").replace(/\|/g, "\\|");
              write(`| \`${probe.probeId}\` | ${detail} |`);
            }
          }
          SCRIPT
          node /tmp/summarize.mjs

      - name: Upload doctor results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-fast-${{ matrix.backend }}
          path: doctor-result.json
          if-no-files-found: ignore
