name: init
description: >-
  Generate full initial documentation for an app directory
  (architecture + plan + phases + verify/fix + baseline).
steps:
  - script:
      name: check-format-version
      label: checking corpus format version
      app_dir: ${app_path}
      docs_dir: ${docs_dir}
      mode: init

  - script:
      name: ensure-gitignore
      label: ensuring .saaga-runs is gitignored
      app_dir: ${app_path}
      pattern: .saaga-runs/

  - agent:
      prompt: document-architecture
      model: high
      label: documenting architecture
      vars:
        app: ${app}
        docs_dir: ${docs_dir}
        scratch_path: ${run_dir}/app-structure.md

  # Planning is retried against a corpus budget the gate derives from the
  # repository. One fixed report path, deliberately: inside iteration N the
  # planner would be handed iteration N's report, which does not exist yet, and
  # the expression language has no arithmetic to ask for N-1. Overwriting one
  # file hands the next attempt the previous verdict for free.
  - loop:
      max: 3
      until: '${budget.status} == "PASS"'
      do:
        - agent:
            prompt: plan-init
            model: high
            label: planning documentation
            vars:
              app: ${app}
              docs_dir: ${docs_dir}
              output_path: ${run_dir}/plans/${app}-init.plan.md
              budget_report_path: ${run_dir}/plan-budget-report.md
            expect_file: ${run_dir}/plans/${app}-init.plan.md

        - script:
            name: parse-plan
            label: parsing plan
            file: ${run_dir}/plans/${app}-init.plan.md
            set: phases

        - script:
            name: check-plan-budget
            label: checking corpus budget
            app_dir: ${app_path}
            docs_dir: ${docs_dir}
            plan: ${run_dir}/plans/${app}-init.plan.md
            report_path: ${run_dir}/plan-budget-report.md
            mode: report
            set: budget

  # The loop exits silently at its cap, so this is what actually fails the run.
  - script:
      name: check-plan-budget
      label: enforcing corpus budget
      app_dir: ${app_path}
      docs_dir: ${docs_dir}
      plan: ${run_dir}/plans/${app}-init.plan.md
      report_path: ${run_dir}/plan-budget-report.md
      mode: enforce

  - loop:
      max: 3
      until: '${arch_status} == "PASS"'
      do:
        - agent:
            prompt: verify-architecture
            model: high
            label: verifying architecture
            vars:
              plan: ${run_dir}/plans/${app}-init.plan.md
              review_path: ${run_dir}/architecture/review-${iteration}.md
              status_path: ${run_dir}/architecture/status-${iteration}.txt
              docs_dir: ${docs_dir}
              date: ${iso_date}
              iteration: ${iteration}
              loop_max: ${loop_max}
              deferred_minors_path: ${run_dir}/architecture/deferred-minors.md

        - read-file:
            path: ${run_dir}/architecture/status-${iteration}.txt
            set: arch_status
            trim: true

        - if: '${arch_status} != "PASS"'
          then:
            - agent:
                prompt: fix-documentation
                model: high
                label: fixing architecture
                vars:
                  plan: ${run_dir}/plans/${app}-init.plan.md
                  phase_number: architecture
                  review_path: ${run_dir}/architecture/review-${iteration}.md
                  docs_dir: ${docs_dir}

  - agent:
      prompt: slice-doc
      model: high
      label: documenting overview
      vars:
        plan: ${run_dir}/plans/${app}-init.plan.md
        phase_number: 0
        docs_dir: ${docs_dir}

  - script:
      name: install-rules
      label: installing rules
      app_dir: ${app_path}
      app: ${app}
      rule_targets: ${rule_targets}
      docs_dir: ${docs_dir}

  - foreach:
      var: phase
      in: ${phases}
      when: '${phase.number} != 0'
      do:
        - agent:
            prompt: slice-doc
            model: high
            label: documenting "${phase.title}"
            vars:
              plan: ${run_dir}/plans/${app}-init.plan.md
              phase_number: ${phase.number}
              docs_dir: ${docs_dir}

        - loop:
            max: 3
            until: '${status} == "PASS"'
            do:
              - agent:
                  prompt: verify-domain-documentation
                  model: high
                  label: verifying "${phase.title}"
                  vars:
                    plan: ${run_dir}/plans/${app}-init.plan.md
                    phase_number: ${phase.number}
                    review_path: ${run_dir}/slice-${phase.number}/review-${iteration}.md
                    status_path: ${run_dir}/slice-${phase.number}/status-${iteration}.txt
                    changes_dir: none
                    docs_dir: ${docs_dir}
                    date: ${iso_date}
                    iteration: ${iteration}
                    loop_max: ${loop_max}
                    deferred_minors_path: ${run_dir}/slice-${phase.number}/deferred-minors.md

              - read-file:
                  path: ${run_dir}/slice-${phase.number}/status-${iteration}.txt
                  set: status
                  trim: true

              - if: '${status} != "PASS"'
                then:
                  - agent:
                      prompt: fix-documentation
                      model: high
                      label: fixing "${phase.title}"
                      vars:
                        plan: ${run_dir}/plans/${app}-init.plan.md
                        phase_number: ${phase.number}
                        review_path: ${run_dir}/slice-${phase.number}/review-${iteration}.md
                        docs_dir: ${docs_dir}

  - script:
      name: generate-baseline
      label: generating baseline
      app_dir: ${app_path}
      docs_dir: ${docs_dir}

  - script:
      name: stamp-format-version
      label: stamping corpus format version
      app_dir: ${app_path}
      docs_dir: ${docs_dir}

  - script:
      name: generate-navigation
      label: generating navigation
      app_dir: ${app_path}
      docs_dir: ${docs_dir}
      app: ${app}
      set: navigation

  - script:
      name: validate-docs
      label: validating documentation
      app_dir: ${app_path}
      docs_dir: ${docs_dir}
      output_dir: ${run_dir}
      set: validation
