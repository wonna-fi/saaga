name: sweep-stale-docs
description: >-
  Verify every document whose sources changed since its last verification,
  regardless of which slice last touched it. Selects stale documents from git
  history, plans them into phases, and runs the verify/fix loop per phase.
steps:
  - script:
      name: check-format-version
      label: checking corpus format version
      app_dir: ${app_path}
      docs_dir: ${docs_dir}
      mode: update

  - script:
      name: select-stale-docs
      label: selecting stale documents
      app_dir: ${app_path}
      docs_dir: ${docs_dir}
      output_dir: ${run_dir}
      set: stale

  - if: '${stale.count} != 0'
    label: sweeping stale documentation
    skip_label: no stale documents
    then:
      - agent:
          prompt: plan-sweep-stale-docs
          model: high
          label: planning the sweep
          vars:
            app: ${app}
            docs_dir: ${docs_dir}
            stale_report_path: ${stale.report_path}
            output_path: ${run_dir}/plans/${app}-sweep-stale-docs-${date}.plan.md
          expect_file: ${run_dir}/plans/${app}-sweep-stale-docs-${date}.plan.md

      # Documents were selected, so an empty plan would verify nothing while
      # reporting success.
      - script:
          name: parse-plan
          label: parsing plan
          file: ${run_dir}/plans/${app}-sweep-stale-docs-${date}.plan.md
          require_phases: true
          set: phases

      # No slice-doc: a stale document is verified, and rewritten only where
      # verification finds it wrong. changes_dir is none because coverage of
      # undocumented code is update's job, not the sweep's.
      - foreach:
          var: phase
          in: ${phases}
          do:
            - loop:
                max: 3
                until: '${status} == "PASS"'
                do:
                  - agent:
                      prompt: verify-domain-documentation
                      model: high
                      label: verifying "${phase.title}"
                      vars:
                        plan: ${run_dir}/plans/${app}-sweep-stale-docs-${date}.plan.md
                        phase_number: ${phase.number}
                        review_path: ${run_dir}/slice-${phase.number}/review-${iteration}.md
                        status_path: ${run_dir}/slice-${phase.number}/status-${iteration}.txt
                        changes_dir: none
                        docs_dir: ${docs_dir}
                        date: ${iso_date}
                        iteration: ${iteration}
                        loop_max: ${loop_max}
                        deferred_minors_path: ${run_dir}/slice-${phase.number}/deferred-minors.md

                  - read-file:
                      path: ${run_dir}/slice-${phase.number}/status-${iteration}.txt
                      set: status
                      trim: true

                  - if: '${status} != "PASS"'
                    then:
                      - agent:
                          prompt: fix-documentation
                          model: high
                          label: fixing "${phase.title}"
                          vars:
                            plan: ${run_dir}/plans/${app}-sweep-stale-docs-${date}.plan.md
                            phase_number: ${phase.number}
                            review_path: ${run_dir}/slice-${phase.number}/review-${iteration}.md
                            docs_dir: ${docs_dir}

      - script:
          name: generate-navigation
          label: generating navigation
          app_dir: ${app_path}
          docs_dir: ${docs_dir}
          app: ${app}
          set: navigation

      - script:
          name: validate-docs
          label: validating documentation
          app_dir: ${app_path}
          docs_dir: ${docs_dir}
          output_dir: ${run_dir}
          set: validation
